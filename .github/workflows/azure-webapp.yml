name: azure-webapp

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Solo ejecutar si los secrets de Azure están configurados
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate backend
        run: python -m py_compile server.py

      - name: Prepare artifact
        run: |
          zip -r release.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "android-quality-app/*" \
            -x "portable-python/*" \
            -x "portable-python-lite/*" \
            -x "__pycache__/*" \
            -x "*.apk" \
            -x "*.log" \
            -x "data/*"

      - name: Verificar secrets configurados
        id: check-secrets
        run: |
          if [ -z "${{ secrets.AZURE_WEBAPP_NAME }}" ]; then
            echo "AZURE_WEBAPP_NAME no configurado. Agrega el secret en GitHub → Settings → Secrets."
            echo "skip_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "skip_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Azure Web App
        if: steps.check-secrets.outputs.skip_deploy == 'false'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
