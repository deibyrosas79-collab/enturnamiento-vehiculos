name: azure-aci

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  ACR_LOGIN_SERVER: acrentd79prod.azurecr.io
  IMAGE_NAME: enturnamiento-app
  ACI_NAME: enturnamiento-diana-d79
  RESOURCE_GROUP: rg-enturnamiento-prod
  LOCATION: eastus2
  DNS_LABEL: enturnamiento-d79-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_ACI_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Delete existing ACI container
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az container delete \
              --name ${{ env.ACI_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --yes || true

      - name: Deploy to Azure Container Instances
        uses: azure/aci-deploy@v1
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          dns-name-label: ${{ env.DNS_LABEL }}
          image: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          name: ${{ env.ACI_NAME }}
          location: ${{ env.LOCATION }}
          registry-login-server: ${{ env.ACR_LOGIN_SERVER }}
          registry-username: ${{ secrets.ACR_USERNAME }}
          registry-password: ${{ secrets.ACR_PASSWORD }}
          environment-variables: HOST=0.0.0.0 PORT=8000 UPLOADS_DIR=/var/data/uploads AZURE_STORAGE_ACCOUNT=stenturnad79prod AZURE_STORAGE_CONTAINER=evidencias
          secure-environment-variables: DATABASE_URL=${{ secrets.AZURE_DATABASE_URL }}
          ports: "8000"
          cpu: 1
          memory: 1.5

      - name: Mostrar URL de la aplicacion
        run: echo "App disponible en http://${{ env.DNS_LABEL }}.${{ env.LOCATION }}.azurecontainer.io:8000"
