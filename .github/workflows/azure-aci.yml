name: azure-aci

on:
  workflow_dispatch:
  push:
    branches: ["main"]

env:
  ACR_LOGIN_SERVER: acrentd79prod.azurecr.io
  IMAGE_NAME: enturnamiento-app
  RESOURCE_GROUP: rg-enturnamiento-prod
  LOCATION: eastus2
  STORAGE_ACCOUNT: stenturnad79prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_ACI_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Obtener storage key y crear file share para certificados TLS
      - name: Preparar almacenamiento de certificados
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            KEY=$(az storage account keys list \
              --account-name ${{ env.STORAGE_ACCOUNT }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query '[0].value' -o tsv)
            echo "CADDY_STORAGE_KEY=$KEY" >> $GITHUB_ENV
            az storage share create \
              --name caddy-certs \
              --account-name ${{ env.STORAGE_ACCOUNT }} \
              --account-key "$KEY" \
              --quota 1 2>/dev/null || true

      # ── Contenedor HTTPS (principal) ──────────────────────────────────────
      - name: Borrar contenedor HTTPS anterior
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az container delete --name enturnamiento-diana-d79-https \
              --resource-group ${{ env.RESOURCE_GROUP }} --yes 2>/dev/null || true

      - name: Deploy contenedor HTTPS
        uses: azure/aci-deploy@v1
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          dns-name-label: enturnamiento-d79-secure
          image: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          name: enturnamiento-diana-d79-https
          location: ${{ env.LOCATION }}
          registry-login-server: ${{ env.ACR_LOGIN_SERVER }}
          registry-username: ${{ secrets.ACR_USERNAME }}
          registry-password: ${{ secrets.ACR_PASSWORD }}
          environment-variables: HOST=0.0.0.0 PORT=8000 UPLOADS_DIR=/var/data/uploads AZURE_STORAGE_ACCOUNT=${{ env.STORAGE_ACCOUNT }} AZURE_STORAGE_CONTAINER=evidencias ENABLE_HTTPS=true CADDY_DOMAIN=enturnamiento-d79-secure.eastus2.azurecontainer.io
          secure-environment-variables: DATABASE_URL=${{ secrets.AZURE_DATABASE_URL }}
          ports: "80 443 8000"
          cpu: 1
          memory: 1.5
          azure-file-volume-share-name: caddy-certs
          azure-file-volume-storage-account-name: ${{ env.STORAGE_ACCOUNT }}
          azure-file-volume-storage-account-key: ${{ env.CADDY_STORAGE_KEY }}
          azure-file-volume-mount-path: /root/.local/share/caddy

      # ── Contenedor HTTP (compatibilidad APK) ──────────────────────────────
      - name: Borrar contenedor HTTP anterior
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az container delete --name enturnamiento-diana-d79 \
              --resource-group ${{ env.RESOURCE_GROUP }} --yes 2>/dev/null || true

      - name: Deploy contenedor HTTP
        uses: azure/aci-deploy@v1
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          dns-name-label: enturnamiento-d79-app
          image: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          name: enturnamiento-diana-d79
          location: ${{ env.LOCATION }}
          registry-login-server: ${{ env.ACR_LOGIN_SERVER }}
          registry-username: ${{ secrets.ACR_USERNAME }}
          registry-password: ${{ secrets.ACR_PASSWORD }}
          environment-variables: HOST=0.0.0.0 PORT=8000 UPLOADS_DIR=/var/data/uploads AZURE_STORAGE_ACCOUNT=${{ env.STORAGE_ACCOUNT }} AZURE_STORAGE_CONTAINER=evidencias
          secure-environment-variables: DATABASE_URL=${{ secrets.AZURE_DATABASE_URL }}
          ports: "8000"
          cpu: 1
          memory: 1.5

      - name: URLs finales
        run: |
          echo "HTTPS: https://enturnamiento-d79-secure.eastus2.azurecontainer.io"
          echo "HTTP:  http://enturnamiento-d79-app.eastus2.azurecontainer.io:8000"
